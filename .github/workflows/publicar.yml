# Corre las pruebas en cada cambio.
# La app se publica con GitHub Pages directo desde la rama main
# (Settings › Pages › Source: Deploy from a branch › main › / (root)).
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
